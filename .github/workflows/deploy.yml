name: Deploy Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build on the runner (plenty of memory) instead of on the small EC2,
      # which runs out of memory during prerendering.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (prerendered static site)
        run: npm run build

      # SAFETY: abort before touching the live server if the build is empty.
      - name: Verify build output
        run: |
          test -f dist/seejobrun-web/browser/index.html
          echo "Build OK. Prerendered files:"
          find dist/seejobrun-web/browser -name index.html | sort

      # Fails the deploy if the old company name or a retired price ships (CCP 2026-10-01).
      - name: Content guard
        run: node scripts/check-content.mjs

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # The landing key is LOCKED on the server (2026-10-01): authorized_keys runs it as
      #   restrict,command="rrsync -wo /var/www/html/seejobmain/seejobrun-web/browser"
      # so it can only upload, only with rsync, only into the landing folder, and the
      # rsync destination below is RELATIVE to that folder ("./").
      # SAFETY: if the key were ever unlocked, "./" would mean the home folder and
      # --delete would empty it. So prove the lock first — a plain shell command must
      # be REFUSED — and stop if it runs.
      - name: Prove the deploy key is locked to rsync
        run: |
          if ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
               "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'echo UNLOCKED-SHELL' 2>/dev/null | grep -q UNLOCKED-SHELL; then
            echo "::error::The landing deploy key can run a shell — it is not locked. Refusing to rsync a relative path."
            exit 1
          fi
          echo "OK: a shell command was refused; the key is locked to rsync."

      # Only reached if the build succeeded above (any prior step failing stops the job),
      # so rsync --delete can never wipe the live site against an empty build.
      - name: Deploy to EC2 via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            dist/seejobrun-web/browser/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:./"
