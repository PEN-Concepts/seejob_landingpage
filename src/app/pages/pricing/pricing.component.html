<section class="pricing-section">
  <div class="container mx-auto px-4 md:px-6">
    <div
      class="text-primary text-3xl lg:text-4xl leading-[1.3] tracking-[-0.4px] font-bold text-center pt-8 md:pt-[70px]"
    >
      One simple price. Every feature.
    </div>
    <div
      class="text-lg lg:text-xl leading-[1.5] tracking-[-0.2px] text-center mt-4 md:mt-8 max-w-3xl mx-auto opacity-90"
    >
      Priced by the size of your team — not by which features you're allowed to use.
      Every feature is on every plan. Try it free for 60 days.
    </div>
    <div class="mt-8 md:mt-[60px] pb-10 lg:pb-[130px]">
      <!-- Plans come from content/why-seejobrun-content.ts (TIERS) — the one place prices live. -->
      <div class="pricing-grid pricing-grid--3">
        <div class="plan-card" [class.plan-card--popular]="t.badge" *ngFor="let t of tiers">
          <span class="plan-badge" *ngIf="t.badge">{{ t.badge }}</span>
          <div class="plan-header">
            <h3 class="plan-name">{{ t.name }}</h3>
          </div>
          <div class="plan-price-section">
            <div class="plan-price">{{ t.price }}</div>
            <div class="plan-price-period">/month</div>
          </div>
          <div class="plan-seats">{{ t.users }}</div>
          <div class="plan-actions">
            <a href="https://seejobrun.com/user-dashboard/signup" target="_blank" class="plan-btn plan-btn--primary">{{ t.cta }}</a>
          </div>
          <div class="plan-features-divider"></div>
          <ul class="plan-features">
            <li *ngFor="let c of chips">{{ c }}</li>
          </ul>
        </div>
      </div>
      <div class="text-lg lg:text-xl leading-[1.5] tracking-[-0.16px] text-center mt-8 md:mt-12 opacity-80">
        {{ note }}
      </div>
      <div class="text-center mt-6">
        <a routerLink="/why-seejobrun" class="text-primary font-semibold underline underline-offset-4">See how See Job Run compares →</a>
      </div>
    </div>
  </div>
</section>
