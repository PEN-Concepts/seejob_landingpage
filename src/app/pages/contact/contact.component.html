<!-- Hero Section -->
<p-toast></p-toast>
<section>
  <div class="container mx-auto px-4 md:px-0">
    <div
      class="text-primary text-3xl lg:text-4xl font-semibold leading-[1.3] tracking-[-0.4px] mt-10 text-center"
    >
      Contact Us
    </div>
    <div
      class="text-base lg:text-lg leading-[1.5] tracking-[-0.2px] text-center px-4 lg:px-20 mt-6 mb-12"
    >
      Have questions or need support? We'd love to hear from you. Reach out
      through any of the channels below or fill out the form.
    </div>
  </div>
</section>

<!-- Contact Info Cards -->
<section class="bg-[rgba(213,231,243,0.52)]">
  <div class="container mx-auto px-4 md:px-0 py-12">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Phone Card -->
      <p-card styleClass="text-center contact-card">
        <div class="flex flex-col items-center gap-4 py-4">
          <div
            class="w-16 h-16 rounded-full bg-primary flex items-center justify-center"
          >
            <i class="pi pi-phone text-white text-2xl"></i>
          </div>
          <div class="text-xl font-semibold text-primary">Phone Number</div>
          <div class="text-base leading-[1.5] tracking-[-0.16px]">
            +1 (555) 123-4567
          </div>
        </div>
      </p-card>

      <!-- Email Card -->
      <p-card styleClass="text-center contact-card">
        <div class="flex flex-col items-center gap-4 py-4">
          <div
            class="w-16 h-16 rounded-full bg-primary flex items-center justify-center"
          >
            <i class="pi pi-envelope text-white text-2xl"></i>
          </div>
          <div class="text-xl font-semibold text-primary">Email</div>
          <div class="text-base leading-[1.5] tracking-[-0.16px]">
            support&#64;seejobrun.com
          </div>
        </div>
      </p-card>

      <!-- Address Card -->
      <p-card styleClass="text-center contact-card">
        <div class="flex flex-col items-center gap-4 py-4">
          <div
            class="w-16 h-16 rounded-full bg-primary flex items-center justify-center"
          >
            <i class="pi pi-map-marker text-white text-2xl"></i>
          </div>
          <div class="text-xl font-semibold text-primary">Address</div>
          <div class="text-base leading-[1.5] tracking-[-0.16px]">
            123 Construction Ave,<br />
            Suite 200, Austin, TX 78701
          </div>
        </div>
      </p-card>
    </div>
  </div>
</section>

<!-- Contact Form Section -->
<section>
  <div class="container mx-auto px-4 md:px-0 py-12">
    <div
      class="text-primary text-2xl lg:text-3xl font-semibold leading-[1.3] tracking-[-0.3px] text-center mb-10"
    >
      Send Us a Message
    </div>
    <div
      class="max-w-3xl mx-auto bg-white rounded-[18px] shadow-[0_0_8px_0_rgba(128,170,205,0.85)] p-8 lg:p-12"
    >
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- First Name -->
          <div class="flex flex-col gap-2">
            <label for="firstName" class="text-sm font-semibold">
              First Name <span class="text-red-500">*</span>
            </label>
            <input
              pInputText
              id="firstName"
              formControlName="firstName"
              placeholder="Enter your first name"
              class="w-full"
              [ngClass]="{
                'ng-invalid ng-dirty': firstName?.invalid && firstName?.touched,
              }"
            />
            <p-message
              *ngIf="firstName?.invalid && firstName?.touched"
              severity="error"
              text="First name is required"
            ></p-message>
          </div>

          <!-- Last Name -->
          <div class="flex flex-col gap-2">
            <label for="lastName" class="text-sm font-semibold">
              Last Name <span class="text-red-500">*</span>
            </label>
            <input
              pInputText
              id="lastName"
              formControlName="lastName"
              placeholder="Enter your last name"
              class="w-full"
              [ngClass]="{
                'ng-invalid ng-dirty': lastName?.invalid && lastName?.touched,
              }"
            />
            <p-message
              *ngIf="lastName?.invalid && lastName?.touched"
              severity="error"
              text="Last name is required"
            ></p-message>
          </div>

          <!-- Email -->
          <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-semibold">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              pInputText
              id="email"
              formControlName="email"
              type="email"
              placeholder="Enter your email"
              class="w-full"
              [ngClass]="{
                'ng-invalid ng-dirty': email?.invalid && email?.touched,
              }"
            />
            <p-message
              *ngIf="email?.invalid && email?.touched"
              severity="error"
              [text]="
                email?.errors?.['email']
                  ? 'Please enter a valid email address'
                  : 'Invalid email format'
              "
            ></p-message>
          </div>

          <!-- Phone Number -->
          <div class="flex flex-col gap-2">
            <label for="phone" class="text-sm font-semibold">
              Phone Number
            </label>
            <input
              pInputText
              id="phone"
              formControlName="phone"
              type="tel"
              placeholder="+1 (555) 123-4567"
              class="w-full"
              [ngClass]="{
                'ng-invalid ng-dirty': phone?.invalid && phone?.touched,
              }"
              (input)="onPhoneInput($event)"
            />
            <p-message
              *ngIf="phone?.invalid && phone?.touched"
              severity="error"
              text="Phone number must be in format: +1 (555) 123-4567"
            ></p-message>
          </div>
        </div>

        <!-- Message -->
        <div class="flex flex-col gap-2 mt-6">
          <label for="message" class="text-sm font-semibold">
            Message <span class="text-red-500">*</span>
          </label>
          <textarea
            pTextarea
            id="message"
            formControlName="message"
            rows="5"
            placeholder="Write your message here..."
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty': message?.invalid && message?.touched,
            }"
          ></textarea>
          <p-message
            *ngIf="message?.invalid && message?.touched"
            severity="error"
            text="Message is required"
          ></p-message>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-center mt-8">
          <p-button
            type="submit"
            label="Submit"
            severity="info"
            class="contact-submit-btn"
            [disabled]="loading"
          ></p-button>
        </div>
      </form>
    </div>
  </div>
</section>
