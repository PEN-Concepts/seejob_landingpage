<p-dialog
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
  (onHide)="hideDialog()"
>
  <div class="contact-form-container">
    <div
      class="text-primary text-xl font-semibold leading-[1.3] tracking-[-0.3px] text-center mb-6"
    >
      {{ formTitle }}
    </div>
    <div class="text-base text-center mb-8">
      {{ formDescription }}
    </div>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- First Name -->
        <div class="flex flex-col gap-2">
          <label for="firstName" class="text-sm font-semibold">
            First Name <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="firstName"
            formControlName="firstName"
            placeholder="Enter your first name"
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty': firstName?.invalid && firstName?.touched,
            }"
          />
          <p-message
            *ngIf="firstName?.invalid && firstName?.touched"
            severity="error"
            text="First name is required"
          ></p-message>
        </div>

        <!-- Last Name -->
        <div class="flex flex-col gap-2">
          <label for="lastName" class="text-sm font-semibold">
            Last Name <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="lastName"
            formControlName="lastName"
            placeholder="Enter your last name"
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty': lastName?.invalid && lastName?.touched,
            }"
          />
          <p-message
            *ngIf="lastName?.invalid && lastName?.touched"
            severity="error"
            text="Last name is required"
          ></p-message>
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-semibold">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="email"
            formControlName="email"
            type="email"
            placeholder="Enter your email"
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty': email?.invalid && email?.touched,
            }"
          />
          <p-message
            *ngIf="email?.invalid && email?.touched"
            severity="error"
            [text]="
              email?.errors?.['email']
                ? 'Please enter a valid email address'
                : 'Invalid email format'
            "
          ></p-message>
        </div>

        <!-- Phone Number -->
        <div class="flex flex-col gap-2">
          <label for="phone" class="text-sm font-semibold">
            Phone Number
          </label>
          <input
            pInputText
            id="phone"
            formControlName="phone"
            type="tel"
            placeholder="+1 (555) 123-4567"
            class="w-full"
            [ngClass]="{
              'ng-invalid ng-dirty': phone?.invalid && phone?.touched,
            }"
            (input)="onPhoneInput($event)"
          />
          <p-message
            *ngIf="phone?.invalid && phone?.touched"
            severity="error"
            text="Phone number must be in format: +1 (555) 123-4567"
          ></p-message>
        </div>
      </div>

      <!-- Message -->
      <div class="flex flex-col gap-2 mt-4">
        <label for="message" class="text-sm font-semibold">
          Message <span class="text-red-500">*</span>
        </label>
        <textarea
          pTextarea
          id="message"
          formControlName="message"
          rows="4"
          placeholder="Write your message here..."
          class="w-full"
          [ngClass]="{
            'ng-invalid ng-dirty': message?.invalid && message?.touched,
          }"
        ></textarea>
        <p-message
          *ngIf="message?.invalid && message?.touched"
          severity="error"
          text="Message is required"
        ></p-message>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end gap-3 mt-6">
        <p-button
          label="Cancel"
          severity="secondary"
          (click)="hideDialog()"
        ></p-button>
        <p-button
          type="submit"
          [label]="submitButtonText"
          severity="info"
        ></p-button>
      </div>
    </form>
  </div>
</p-dialog>
