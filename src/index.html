<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>See Job Run — Construction Management Software for Contractors</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See Job Run is construction management software built for independent general contractors and field crews. Run jobs, tasks, scheduling, time cards, photos, and reports from one app — on any phone, tablet or computer. English & Spanish. From $69/month, every feature, 60-day free trial.">
  <meta name="keywords" content="construction management software, contractor app, job management, task manager, field service, crew scheduling, time cards, construction CRM, general contractor software">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://seejobrun.com/">
  <!-- Brand favicon: rendered PNG/ICO from "See Job Run Logo 02" (the house/tools
       mark) so the tab reliably shows the icon image at every size — NOT a raw SVG.
       Same set as the app so the tab/PWA icon is consistent everywhere. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- PWA install: makes the marketing site installable so the homepage
       "Install SeeJobRun" button can fire the real native prompt. The installed
       app opens the SeeJobRun web app (see manifest start_url). -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0c0f">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SeeJobRun">
  <script>
    // Capture the Android/Chrome install prompt as early as possible (it can fire
    // before Angular boots) so the homepage button can trigger it on tap.
    window.__sjrInstall = { event: null, installed: false };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__sjrInstall.event = e;
      window.dispatchEvent(new Event('sjr-install-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__sjrInstall.event = null;
      window.__sjrInstall.installed = true;
      window.dispatchEvent(new Event('sjr-install-done'));
    });
    // Register the no-cache service worker (required for installability).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      });
    }
  </script>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="See Job Run">
  <meta property="og:title" content="See Job Run — Construction Management Software for Contractors">
  <meta property="og:description" content="Run every job from one place. Jobs, tasks, scheduling, photos & reports for contractors — English & Spanish, on every device. From $69/month, 60-day free trial.">
  <meta property="og:url" content="https://seejobrun.com/">
  <meta property="og:image" content="https://seejobrun.com/images/screens/pic-track.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="See Job Run — Construction Management Software">
  <meta name="twitter:description" content="Run every job from one place. Built for contractors. English & Spanish. From $69/month, every feature, 60-day free trial.">
  <meta name="twitter:image" content="https://seejobrun.com/images/screens/pic-track.png">

  <!-- Structured data is per page (shared/seo-schemas.ts via JsonLdComponent). -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
